name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-node:
    name: Node.js Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # Node >= 21 expands the quoted glob in `node --test "tests/**/*.mjs"`;
          # on Node 20 the pattern is treated as a literal path and the stage
          # dies with `Could not find 'tests/**/*.mjs'`.
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Install the dashboard UI dependencies
        run: npm ci --prefix ui
      - name: Run the dashboard UI tests (Vitest)
        run: npm test --prefix ui

  test-python:
    name: Python Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # The pytest half drives Node legs (the deliberate bridge, the
          # `deliberate` e2e journey) and skill-audit probes resolve the
          # repo's root node_modules; without both the bridge refuses with
          # "workspace node dependencies are missing".
          node-version: 24.x
          cache: "npm"
      - name: Provision the forge environment (micromamba)
        # The gate names `.micromamba/envs/papersmith/bin/pytest` -- package.json
        # `test:py`, enforced by tests/test_forge_gate.py -- so CI must
        # provision THAT environment, not a `.venv` no script in this
        # repository creates. `.venv` is linked to it because the skill-audit
        # self-guarded-facts probe runs `<repo>/.venv/bin/python` directly, and
        # `--no-ingestion` skips only `PIP_PACKAGES` (`marker-pdf`), which the
        # gate's own derivation declares skippable.
        run: |
          python3 scripts/setup_env.py install --no-ingestion
          ln -s .micromamba/envs/papersmith .venv
      - name: Install node dependencies
        run: npm ci
      - name: Run the gate, and verify it does not read the operator's personal context
        # This step is the suite. The declared gate runs twice: once under an
        # empty HOME and once under one carrying the shapes a developer's machine
        # has (.pi/agent/mcp.json, .agents/skills, .claude/skills, .engram). It
        # fails when the two runs disagree, naming the test, and it fails when
        # the empty-HOME run itself fails, so a red suite cannot pass here. A
        # separate plain `pytest` step used to precede it and repeated the
        # empty-HOME pass for about 11 minutes. Both homes are synthetic on
        # purpose: comparing "my real home" against "an empty one" would be
        # trivially green on a runner.
        run: python3 scripts/clean_context_gate.py
